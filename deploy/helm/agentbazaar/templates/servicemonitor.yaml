{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agentbazaar.fullname" . }}-api
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentbazaar.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    # The agents pool serves the same /metrics.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "agents"]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
