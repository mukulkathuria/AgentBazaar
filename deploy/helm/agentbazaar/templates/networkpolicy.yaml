{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "agentbazaar.fullname" . }}
{{- $release := dict "app.kubernetes.io/name" (include "agentbazaar.name" .) "app.kubernetes.io/instance" .Release.Name }}
# Default deny: no pod of this release accepts traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $release | nindent 6 }}
  policyTypes:
    - Ingress
---
# Ingress controller or load balancer -> web and api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-public
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $release | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["web", "api"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: http
---
# web -> api (server-side rendering calls the API inside the cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-web-to-api
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentbazaar.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentbazaar.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - port: http
{{- if .Values.ai.enabled }}
---
# api -> ai.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-api-to-ai
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentbazaar.selectorLabels" (dict "root" . "component" "ai") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentbazaar.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - port: http
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
# Prometheus -> api /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow-metrics
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentbazaar.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: http
{{- end }}
{{- end }}
