{{- if .Values.migrations.enabled }}
{{- /* A hook runs before the release's ConfigMap and ServiceAccount exist, so env is inlined and the
       namespace's default service account (without a token) is used. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentbazaar.fullname" . }}-migrate
  labels:
    {{- include "agentbazaar.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "agentbazaar.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "agentbazaar.image" (dict "root" . "component" .Values.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          env:
            {{- range $key, $value := include "agentbazaar.config" . | fromYaml }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.pgbouncer.enabled }}
            # Migrations go to the primary directly (the pooler may not be up yet before install).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentbazaar.secretName" . }}
                  key: {{ .Values.pgbouncer.upstreamSecretKey }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "agentbazaar.secretName" . }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
