# Client authentication for the Compose Postgres: the image's defaults (trust inside the container, passwords
# over the network) plus password-authenticated streaming replication, which postgres-replica (growth) needs.
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
host    all          all   all            scram-sha-256
host    replication  all   all            scram-sha-256
