# AgentBazaar on Docker Compose.
#   60-second demo, no keys:  docker compose -f deploy/compose/docker-compose.yml --profile demo up --build
#   Lite store (one VPS):      cp .env.example .env  # fill in secrets, then
#                              docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile lite up -d --build
#   Growth services:           add --profile growth   (Meilisearch, NATS JetStream, OpenBao, Keycloak, PgBouncer and a
#                              streaming read replica; set DATABASE_HOST and DATABASE_REPLICA_URLS in .env to use them)
#   Scale services:            add --profile scale    (Kafka, OpenSearch, Qdrant, Temporal and the checkout saga
#                              worker; set WORKFLOW_ENGINE=temporal and TEMPORAL_ADDRESS=temporal:7233 in .env)
#   Metrics:                   add --profile observability (Prometheus, Grafana)
name: agentbazaar

x-api: &api
  build: { context: ../.., dockerfile: apps/api/Dockerfile }
  image: ghcr.io/mukulkathuria/agentbazaar-api:${APP_VERSION:-latest}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]

x-web: &web
  build: { context: ../.., dockerfile: apps/web/Dockerfile }
  image: ghcr.io/mukulkathuria/agentbazaar-web:${APP_VERSION:-latest}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  # ---------- demo: two containers, embedded Postgres (PGlite), mock payments, no keys ----------
  demo-api:
    <<: *api
    profiles: [demo]
    environment:
      NODE_ENV: production
      DEMO_MODE: 'true'
      SEED_ON_BOOT: 'true'
      DATABASE_DRIVER: pglite
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: '${RATE_LIMIT_PER_MINUTE:-300}' # per client IP; 300 is the API default
    ports: ['4000:4000']
  demo-web:
    <<: *web
    profiles: [demo]
    environment: { API_URL: 'http://demo-api:4000', NEXT_PUBLIC_API_URL: 'http://localhost:4000', NEXT_PUBLIC_SITE_URL: 'http://localhost:3000' }
    ports: ['3000:3000']
    depends_on: [demo-api]

  # ---------- lite: one VPS ----------
  postgres:
    image: pgvector/pgvector:pg18
    profiles: [lite, growth, scale]
    restart: unless-stopped
    # Reaps orphaned healthcheck processes, which the postmaster would otherwise treat as crashed backends.
    init: true
    # Same rules as the image's default, plus password-authenticated streaming replication for postgres-replica.
    command: ['postgres', '-c', 'hba_file=/etc/postgresql/pg_hba.conf']
    environment:
      POSTGRES_DB: agentbazaar
      POSTGRES_USER: agentbazaar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [pgdata:/var/lib/postgresql/data, './pg_hba.conf:/etc/postgresql/pg_hba.conf:ro']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U agentbazaar'], interval: 5s, timeout: 5s, retries: 20 }
  valkey:
    image: valkey/valkey:8-alpine
    profiles: [lite, growth, scale]
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck: { test: ['CMD', 'valkey-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
  api:
    <<: *api
    profiles: [lite, growth, scale]
    env_file: [../../.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentbazaar:${POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres:5432}/agentbazaar
      VALKEY_URL: redis://valkey:6379
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
  web:
    <<: *web
    profiles: [lite, growth, scale]
    env_file: [../../.env]
    environment: { API_URL: 'http://api:4000' }
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    profiles: [lite, growth, scale]
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment: { SITE_DOMAIN: '${SITE_DOMAIN:-localhost}', API_DOMAIN: '${API_DOMAIN:-api.localhost}' }
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data']
    depends_on: [api, web]
  ai:
    build: { context: ../../services/ai }
    image: ghcr.io/mukulkathuria/agentbazaar-ai:${APP_VERSION:-latest}
    profiles: [ai]
    restart: unless-stopped

  # ---------- growth ----------
  # Transaction pooling in front of the primary (DATABASE_HOST=pgbouncer:6432). PgBouncer cannot carry the client's
  # statement_timeout, so set it on the role once: ALTER ROLE agentbazaar SET statement_timeout = '15s'.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    profiles: [growth]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agentbazaar:${POSTGRES_PASSWORD}@postgres:5432/agentbazaar
      LISTEN_PORT: '6432'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '20'
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout
      SERVER_LOGIN_RETRY: '1'
      ADMIN_USERS: agentbazaar
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432'], interval: 5s, timeout: 5s, retries: 20 }
  # Hot standby cloned from the primary on first start; the API reads from it through DATABASE_REPLICA_URLS
  # (postgres://agentbazaar:<password>@postgres-replica:5432/agentbazaar). Failover: docs/runbooks/database-failover.md.
  postgres-replica:
    image: pgvector/pgvector:pg18
    profiles: [growth]
    restart: unless-stopped
    init: true
    user: postgres
    environment: { PGPASSWORD: '${POSTGRES_PASSWORD:-}' }
    command:
      - sh
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until pg_basebackup -h postgres -U agentbazaar -D "$$PGDATA" -X stream -R; do sleep 2; done
        fi
        exec postgres
    volumes: [pgreplica:/var/lib/postgresql]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U agentbazaar'], interval: 5s, timeout: 5s, retries: 20 }
  meilisearch:
    image: getmeili/meilisearch:v1.15
    profiles: [growth]
    environment: { MEILI_MASTER_KEY: '${MEILISEARCH_API_KEY:-}', MEILI_ENV: production }
    volumes: [meili:/meili_data]
  nats:
    image: nats:2-alpine
    profiles: [growth]
    command: ['-js', '-sd', '/data']
    volumes: [nats:/data]
  openbao:
    image: openbao/openbao:2
    profiles: [growth]
    cap_add: [IPC_LOCK]
    environment: { BAO_DEV_ROOT_TOKEN_ID: '${OPENBAO_TOKEN:-}' }
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: [growth]
    command: ['start-dev']
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: '${KEYCLOAK_ADMIN_PASSWORD:-}' }

  # ---------- scale ----------
  kafka:
    image: apache/kafka:3.9.1
    profiles: [scale]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: [scale]
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: 'true', OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m' }
  qdrant:
    image: qdrant/qdrant:v1.15.0
    profiles: [scale]
  # Single-node Temporal keeping its state in a volume; larger installs use Temporal Cloud or its Helm chart.
  temporal:
    image: temporalio/temporal:1.10.0
    profiles: [scale]
    restart: unless-stopped
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--headless', '--db-filename', '/home/temporal/temporal.db']
    volumes: [temporal:/home/temporal]
    healthcheck: { test: ['CMD', 'temporal', 'operator', 'cluster', 'health'], interval: 5s, timeout: 5s, retries: 30 }
  workflow-worker:
    <<: *api
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: workflow-worker }
    image: ghcr.io/mukulkathuria/agentbazaar-worker:${APP_VERSION:-latest}
    profiles: [scale]
    env_file: [../../.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentbazaar:${POSTGRES_PASSWORD}@${DATABASE_HOST:-postgres:5432}/agentbazaar
      VALKEY_URL: redis://valkey:6379
      WORKFLOW_ENGINE: temporal
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }

  # ---------- observability ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro']
  grafana:
    image: grafana/grafana-oss:12.1.0
    profiles: [observability]
    ports: ['3001:3000']

volumes: { pgdata: {}, pgreplica: {}, caddy_data: {}, meili: {}, nats: {}, temporal: {} }
