# AgentBazaar WAF settings, loaded after the Coraza and CRS setup files and before the CRS rules.

# Blocking mode. Request bodies are inspected (JSON through Coraza's JSON processor); response bodies are not
# buffered, because buffering would break the API's streamed replies (SSE on /mcp and the chat endpoint).
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecResponseBodyAccess Off

# Paranoia level 1 with the CRS default anomaly threshold (inbound 5): one critical match blocks with 403.
SecAction "id:900000,phase:1,pass,t:none,nolog,setvar:tx.blocking_paranoia_level=1"

# Exclusion 1: the API also uses PUT (consents), PATCH and DELETE (MCP session teardown), which CRS rule 911100
# would block (its default list is GET HEAD POST OPTIONS).
SecAction "id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Exclusion 2: payment webhooks are authenticated by an HMAC over the raw body before the API reads anything, and
# a gateway's free-form notes must never cost a payment notification: these requests are scored and logged by the
# CRS but not blocked.
SecRule REQUEST_URI "@beginsWith /api/v1/payments/webhooks/" "id:1000,phase:1,pass,t:none,nolog,ctl:ruleEngine=DetectionOnly"
