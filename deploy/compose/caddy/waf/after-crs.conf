# AgentBazaar rule exclusions that need the CRS rules loaded first.

# Exclusion 3: free text written by shoppers and buyer agents (chat text, negotiation messages, personalisation
# text, A2A message parts) is untrusted data that the API never puts into SQL (parameterised queries only) and
# output-encodes wherever it is shown. Apostrophes and dashes in ordinary sentences trip the SQL-injection rules, so
# those rules skip exactly these JSON fields. Every other rule (XSS included) still inspects them, and the SQL-injection
# rules still inspect every other argument, such as search queries and MCP tool arguments.
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:/^json\.(text|params\.arguments\.(message|text\..+|customization_text\..+)|params\.message\.parts\.\d+\.text)$/"
