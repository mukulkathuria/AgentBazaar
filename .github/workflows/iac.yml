name: IaC

on:
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/iac.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/iac.yml'

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    name: OpenTofu validate + test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [lite, growth, scale]
    defaults:
      run:
        working-directory: deploy/terraform/profiles/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.10.x
          tofu_wrapper: false
      # No backend and no AWS credentials: tests plan against mock_provider "aws".
      - name: Init
        run: tofu init -backend=false -input=false
      - name: Validate
        run: tofu validate
      - name: Test
        run: tofu test
      # OPA policies on a real plan: `tofu test -json -verbose` prints the plan it made against the mocked providers.
      - name: OPA policies on the plan (conftest)
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          curl -fsSLo /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  /tmp/conftest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          tofu test -json -verbose -filter="tests/$PROFILE.tftest.hcl" > /tmp/test.jsonl
          jq -c 'select(.type == "test_plan" and .["@testrun"] == "plans_with_defaults") | .test_plan' /tmp/test.jsonl > /tmp/plan.json
          # Guard against passing on an empty plan: show what the policies saw.
          jq -e '{resources: (.resource_changes | length), iam_documents: ([.. | objects | select(.type? == "aws_iam_policy_document")] | length)} | ., .resources > 5' /tmp/plan.json
          /tmp/conftest test --policy ../../../policies/terraform /tmp/plan.json

  lint:
    name: Format + TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.10.x
          tofu_wrapper: false
      - name: Format
        run: tofu fmt -check -recursive deploy/terraform
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - name: TFLint
        working-directory: deploy/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  checkov:
    name: Checkov (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Blocking policy checks live in `tofu test`; Checkov adds broad advisory coverage until its
      # findings are triaged into a skip list (then set soft_fail: false).
      - uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: deploy
          framework: terraform,helm
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true # pull requests from forks cannot upload results
        with:
          sarif_file: checkov.sarif
          category: checkov

  helm:
    name: Helm lint + render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/helm/agentbazaar
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint and render every values file
        run: |
          for values in values.yaml values-growth.yaml values-scale.yaml; do
            echo "::group::$values"
            helm lint . -f "$values"
            helm template agentbazaar . -f "$values" > /dev/null
            echo "::endgroup::"
          done
      - name: OPA policies on the rendered chart (conftest)
        run: |
          curl -fsSLo /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  /tmp/conftest.tar.gz" | sha256sum -c -
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          /tmp/conftest verify --policy ../../policies/kubernetes
          /tmp/conftest verify --policy ../../policies/terraform
          for values in values.yaml values-growth.yaml values-scale.yaml; do
            helm template agentbazaar . -f "$values" > "/tmp/rendered-$values"
            /tmp/conftest test --combine --policy ../../policies/kubernetes "/tmp/rendered-$values"
          done
