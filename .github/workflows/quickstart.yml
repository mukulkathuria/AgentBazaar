name: Quickstart

# Runs the README's "Try it in 60 seconds" commands on a clean runner, so the README cannot drift
# from the code, and checks that the Mermaid diagrams in the docs match their sources.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: pnpm demo on a clean runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the demo and check it ends with a paid order
        run: |
          set -o pipefail
          timeout 600 pnpm demo 2>&1 | tee demo-output.txt
          grep -q "Order" demo-output.txt || { echo "::error::demo output has no 'Order' line"; exit 1; }
          grep -q "paid" demo-output.txt || { echo "::error::demo output never reports 'paid'"; exit 1; }
      - name: Diagrams match their sources
        run: pnpm docs:check
      - name: Keep the demo transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-output
          path: demo-output.txt
          if-no-files-found: ignore
          retention-days: 14
