name: Supply chain

# Every pull request: GitHub dependency review (fails on high-severity advisories and on licences outside the
# allowlist of scripts/license-check.mjs) and an SBOM diff of base against head in the job summary. Pushes to main
# that change a manifest or lockfile get the same checks against the previous commit, since agents push directly.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'services/ai/uv.lock'
      - 'services/ai/pyproject.toml'
      - '.github/workflows/supply-chain.yml'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The review needs the repository's Dependency graph, a setting only the owner can turn on. While it is off
      # (the SBOM endpoint answers 404) the gate is skipped with a warning instead of failing every push; any other
      # answer runs the review, so a real outage still fails loudly.
      - name: Is the Dependency graph on?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api -i "repos/${{ github.repository }}/dependency-graph/sbom" 2> /dev/null | head -1 | awk '{print $2}')
          if [ "$status" = 404 ]; then
            msg="Dependency review is inactive: the repository's Dependency graph is off. The owner turns it on in Settings > Code security > Dependency graph (docs/security/supply-chain.md). Until then the SBOM diff and the licence gate in the Security workflow are the supply-chain gates."
            echo "::warning title=Dependency review inactive::$msg"
            printf '## Dependency review inactive\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.graph.outputs.run == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ env.BASE_SHA }}
          head-ref: ${{ env.HEAD_SHA }}
          fail-on-severity: high
          # SPDX form of the license gate's allowlist (scripts/license-check.mjs).
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PostgreSQL, MPL-2.0,
            BlueOak-1.0.0, CC0-1.0, Python-2.0, Unlicense, CC-BY-4.0

  sbom-diff:
    name: SBOM diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ env.BASE_SHA }}', path: base, persist-credentials: false }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: '${{ env.HEAD_SHA }}', path: head, persist-credentials: false }
      # pnpm 12 writes pnpm-lock.yaml as two YAML documents (pnpm's own packages, then the project's) and syft
      # reads only the first, so keep the last one.
      - name: Keep the project's lockfile document
        run: |
          for side in base head; do
            awk '/^---$/{n++} {doc[n] = doc[n] $0 ORS} END {printf "%s", doc[n]}' "$side/pnpm-lock.yaml" > lock.tmp
            mv lock.tmp "$side/pnpm-lock.yaml"
          done
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { path: base, format: spdx-json, output-file: base.spdx.json, upload-artifact: false }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { path: head, format: spdx-json, output-file: head.spdx.json, upload-artifact: false }
      - name: Diff into the job summary
        run: |
          export LC_ALL=C # comm needs both lists in the same byte order
          purls() { jq -r '.packages[].externalRefs[]? | select(.referenceType == "purl") | .referenceLocator' "$1" | sort -u; }
          purls base.spdx.json > base.txt
          purls head.spdx.json > head.txt
          comm -13 base.txt head.txt > added.txt
          comm -23 base.txt head.txt > removed.txt
          {
            echo "## SBOM diff"
            echo "$(wc -l < base.txt) packages in base, $(wc -l < head.txt) in head: $(wc -l < added.txt) added, $(wc -l < removed.txt) removed (a version change counts once in each)."
            for f in added removed; do
              if [ -s "$f.txt" ]; then printf '\n### %s\n\n```\n' "${f^}"; cat "$f.txt"; printf '```\n'; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
