name: Quality

# Merge gates for test depth (docs/testing/quality-gates.md):
#   - coverage of domain, application and shared code: at least 85% lines and 80% branches
#   - mutation score: at least 80% on the critical scope (every push and PR), at least 70% on all
#     domain and application code (nightly, or on demand)
on:
  push:
    branches: [main, t2-mutation-trial]
  pull_request:
  schedule:
    - cron: '30 22 * * *' # 04:00 IST, after the security and stack runs
  workflow_dispatch:
    inputs:
      full-mutation:
        description: Also run the full mutation scope (takes hours)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The event name keeps a push to main from cancelling the nightly mutation run.
  group: quality-${{ github.event_name }}-${{ github.ref }}
  # Main moves fast; let each run on main finish so it reports a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage gate (85% lines, 80% branches)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITEST_MAX_WORKERS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@agentbazaar/api^...
      # Application services are exercised through in-process PGlite suites, so the measurement is one
      # merged run of the unit, integration and end-to-end projects (no TEST_DATABASE_URL: PGlite).
      - name: API domain, application and shared code
        run: pnpm --filter @agentbazaar/api test:coverage
      # Not gated: testkit (demo data, scripted buyers) and the web app, which the API and Playwright suites
      # exercise rather than their own unit tests (numbers on the docs page).
      - name: Config and contracts packages
        run: pnpm --filter @agentbazaar/config --filter @agentbazaar/contracts test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: apps/api/coverage/
          retention-days: 14

  coverage-ai:
    name: Coverage gate (AI service)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      # Statements and branches together; the floor is [tool.coverage.report] fail_under in pyproject.toml.
      - run: uv run --frozen pytest --cov --cov-branch --cov-report=term-missing

  mutation-critical:
    name: Mutation gate (critical scope, 80%)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@agentbazaar/api^...
      # Incremental mode: only mutants whose code or covering tests changed since the cached run are retested.
      # The file is saved even when the gate fails, so the next run starts from these results.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/reports/mutation/critical-incremental.json
          key: stryker-critical-${{ github.run_id }}
          restore-keys: stryker-critical-
      - name: Pricing domain, quote signing, inventory, order state machine
        working-directory: apps/api
        timeout-minutes: 75
        run: node_modules/.bin/stryker run stryker.critical.config.mjs --concurrency 4
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: apps/api/reports/mutation/critical-incremental.json
          key: stryker-critical-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-critical
          path: |
            apps/api/reports/mutation/critical.html
            apps/api/reports/mutation/critical.json
          retention-days: 14

  mutation-full:
    name: Mutation gate (all domain and application code, 70%)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full-mutation) || github.ref == 'refs/heads/t2-mutation-trial'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@agentbazaar/api^...
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/reports/mutation/full-incremental.json
          key: stryker-full-${{ github.run_id }}
          restore-keys: stryker-full-
      # Stopped before the job limit, Stryker saves a partial incremental file on the interrupt, so a
      # first run that does not finish in one night carries on from there the next night.
      - name: All domain and application code
        working-directory: apps/api
        timeout-minutes: 320
        run: node_modules/.bin/stryker run --concurrency 4
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: apps/api/reports/mutation/full-incremental.json
          key: stryker-full-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-full
          path: |
            apps/api/reports/mutation/full.html
            apps/api/reports/mutation/full.json
          retention-days: 30
