name: Data scale

# S3 definition of done: query plans stay stable at 100 million order events (docs/benchmarks/data-scale.md).
# Loads 1M, 10M and 100M synthetic order events into the partitioned schema on identical runners and checks
# every hot query's plan shape, partition pruning, pages touched and latency. Runs when the partitioning or
# the harness changes, and nightly. The Services workflow runs the same suite at 1M on every push.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/migrations/005*.sql'
      - 'apps/api/src/shared/partitions/**'
      - 'apps/api/test/services/data-scale.spec.ts'
      - '.github/workflows/data-scale.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-scale-${{ github.ref }}
  # A 100M run takes hours; let it finish and report rather than restart on every push.
  cancel-in-progress: false

jobs:
  data-scale:
    name: Plans at ${{ matrix.label }} order events
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '1M', events: '1000000' }
          - { label: '10M', events: '10000000' }
          - { label: '100M', events: '100000000' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Free disk space and show the runner
        run: |
          # 100M events need ~25 GB of database plus WAL and sort space: drop toolchains this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/lib/jvm /opt/microsoft /opt/google
          docker image prune --all --force > /dev/null
          echo "cpus=$(nproc)"; lscpu | grep -E '^Model name'; free -h; df -h
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start Postgres 18 on the disk with the most room
        run: |
          avail() { df --output=avail -B1G "$1" | tail -1 | tr -d ' '; }
          dir=$HOME/pgdata
          if [ -d /mnt ] && [ "$(avail /mnt)" -gt "$(avail /)" ]; then dir=/mnt/pgdata; fi
          sudo mkdir -p "$dir"
          docker run -d --name pg --shm-size=2g -p 5432:5432 -e POSTGRES_PASSWORD=postgres -v "$dir":/var/lib/postgresql \
            pgvector/pgvector:pg18 postgres -c shared_buffers=4GB -c maintenance_work_mem=2GB -c work_mem=64MB \
            -c max_parallel_maintenance_workers=3 -c max_wal_size=8GB -c fsync=off -c synchronous_commit=off \
            -c full_page_writes=off -c max_connections=50
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          echo "data directory: $dir ($(avail "$(dirname "$dir")") GB free)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@agentbazaar/api^...
      - name: Load ${{ matrix.label }} order events and check the plans
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DATA_SCALE_EVENTS: ${{ matrix.events }}
          DATA_SCALE_PARALLEL: '4'
          DATA_SCALE_REPORT: ${{ github.workspace }}/data-scale-${{ matrix.label }}.json
          VITEST_MAX_WORKERS: '1'
        run: pnpm --filter @agentbazaar/api exec vitest run --project services test/services/data-scale.spec.ts
      - name: Report
        if: always()
        run: |
          df -h
          f=data-scale-${{ matrix.label }}.json
          [ -f "$f" ] || exit 0
          echo "DATA_SCALE_REPORT_BEGIN"; cat "$f"; echo "DATA_SCALE_REPORT_END"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const out = [`### ${r.orderEvents.toLocaleString("en")} order events`, "",
              `load ${r.loadSeconds} s, keys and indexes ${r.indexSeconds} s, VACUUM ANALYZE ${r.vacuumAnalyzeSeconds} s, database ${r.databaseMb} MB`,
              "", "| Query | Pages | Partitions scanned | p50 ms | p95 ms | Budget ms |", "| --- | --- | --- | --- | --- | --- |"];
            for (const [name, p] of Object.entries(r.probes ?? {}))
              out.push(`| ${name} | ${p.buffers} | ${JSON.stringify(p.scanned)} | ${p.p50} | ${p.p95} | ${p.budgetMs} |`);
            console.log(out.join("\n"));' "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Postgres log
        if: failure()
        run: docker logs --tail 100 pg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: data-scale-${{ matrix.label }}
          path: data-scale-${{ matrix.label }}.json
          if-no-files-found: ignore
          retention-days: 30
