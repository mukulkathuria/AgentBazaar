name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: . }
          - { name: ai, file: services/ai/Dockerfile, context: services/ai }
          # Temporal saga worker (scale profile): Debian slim stage, since Temporal ships no musl worker build.
          - { name: workflow-worker, file: apps/api/Dockerfile, context: ., target: workflow-worker }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # Graviton (arm64) hosts in the Terraform profiles need arm64 images too.
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/agentbazaar-${{ matrix.name }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/agentbazaar-${{ matrix.name }}@${{ steps.build.outputs.digest }}
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # syft reads only the first YAML document of pnpm 12's lockfile (pnpm itself); keep the project's (the last).
      - name: Keep the project's lockfile document
        run: |
          awk '/^---$/{n++} {doc[n] = doc[n] $0 ORS} END {printf "%s", doc[n]}' pnpm-lock.yaml > lock.tmp
          mv lock.tmp pnpm-lock.yaml
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { format: spdx-json, output-file: agentbazaar-sbom.spdx.json }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with: { files: agentbazaar-sbom.spdx.json, generate_release_notes: true }
