id = "GHSA-g3hv-75wg-m249" # CVE-2026-118764, minimatch glob-pattern amplification (DoS)
ignoreUntil = 2027-02-01T00:00:00Z
reason = "minimatch 10 comes from eslint and typescript-eslint, which only match our own lint globs, and at runtime from @fastify/otel, which uses it only for a string ignorePaths glob; the API passes a function instead (apps/api/src/shared/observability/tracing.ts), so no attacker controls a pattern. The fix is minimatch 11 (a major); drop this once eslint and @fastify/otel move to it."
