# Real services for the growth and scale suites in apps/api/test/services
# (run them with: pnpm --filter @agentbazaar/api test:services). Endpoints match tests/infra/services.env.
# Start only what a suite needs, for example:
#   docker compose -f tests/infra/docker-compose.yml up -d --wait meilisearch nats
# Throwaway test infrastructure: nothing here is for production, and `down -v` deletes all data.
name: ab-svc

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment: { POSTGRES_PASSWORD: postgres }
    command:
      [
        'postgres',
        '-c',
        'fsync=off',
        '-c',
        'synchronous_commit=off',
        '-c',
        'full_page_writes=off',
        '-c',
        'max_connections=300',
      ]
    ports: ['55432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 2s, timeout: 3s, retries: 30 }

  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'valkey-cli', 'ping'], interval: 2s, timeout: 3s, retries: 30 }

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      { MEILI_MASTER_KEY: ci-only-meili-master-key, MEILI_ENV: development, MEILI_NO_ANALYTICS: 'true' }
    ports: ['7700:7700']
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7700/health'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }

  nats:
    image: nats:2-alpine
    command: ['-js', '-m', '8222']
    ports: ['4222:4222', '8222:8222']
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports: ['9092:9092']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 5s
      timeout: 15s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['9200:9200']
    healthcheck:
      {
        test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:9200/_cluster/health'],
        interval: 5s,
        timeout: 5s,
        retries: 40,
      }

  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ['6333:6333', '6334:6334']
    healthcheck:
      { test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"'], interval: 2s, timeout: 3s, retries: 30 }

  openbao:
    image: openbao/openbao:2
    command: ['server', '-dev', '-dev-root-token-id=ci-only-root-token', '-dev-listen-address=0.0.0.0:8200']
    cap_add: [IPC_LOCK]
    ports: ['8200:8200']
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8200/v1/sys/health'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }

  temporal:
    image: temporalio/temporal:1.10.0
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--headless']
    ports: ['7233:7233']
    healthcheck:
      {
        test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233'],
        interval: 3s,
        timeout: 5s,
        retries: 30,
      }

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_DB: agentbazaar
      CLICKHOUSE_USER: agentbazaar
      CLICKHOUSE_PASSWORD: ci-only-clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    ports: ['8123:8123']
    healthcheck:
      { test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping'], interval: 2s, timeout: 3s, retries: 30 }

  # Failure injection: suites create proxies on ports 26000-26009 in front of the services above.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports: ['8474:8474', '26000-26009:26000-26009']
