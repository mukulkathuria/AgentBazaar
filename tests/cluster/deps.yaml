# What values-growth.yaml expects next to the chart, for the fresh-cluster install test (.github/workflows/cluster.yml):
# Postgres with pgvector, Valkey, Meilisearch, NATS JetStream and OpenBao in dev mode. Same images as tests/infra.
# Throwaway test infrastructure with obviously fake credentials and no persistence: nothing here is for production.
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          args: ['-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'max_connections=300']
          env:
            - { name: POSTGRES_PASSWORD, value: ci-only-postgres }
            - { name: POSTGRES_DB, value: agentbazaar }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ['pg_isready', '-U', 'postgres'] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, labels: { app: valkey } }
spec:
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ['valkey-cli', 'ping'] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: valkey }
spec: { selector: { app: valkey }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: meilisearch, labels: { app: meilisearch } }
spec:
  selector: { matchLabels: { app: meilisearch } }
  template:
    metadata: { labels: { app: meilisearch } }
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.15
          env:
            - { name: MEILI_MASTER_KEY, value: ci-only-meili-master-key }
            - { name: MEILI_ENV, value: development }
            - { name: MEILI_NO_ANALYTICS, value: 'true' }
          ports: [{ containerPort: 7700 }]
          readinessProbe: { httpGet: { path: /health, port: 7700 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: meilisearch }
spec: { selector: { app: meilisearch }, ports: [{ port: 7700 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nats, labels: { app: nats } }
spec:
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ['-js', '-m', '8222']
          ports: [{ containerPort: 4222 }, { containerPort: 8222 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8222 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: nats }
spec: { selector: { app: nats }, ports: [{ port: 4222 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: openbao, labels: { app: openbao } }
spec:
  selector: { matchLabels: { app: openbao } }
  template:
    metadata: { labels: { app: openbao } }
    spec:
      containers:
        - name: openbao
          image: openbao/openbao:2
          args: ['server', '-dev', '-dev-root-token-id=ci-only-root-token', '-dev-listen-address=0.0.0.0:8200']
          securityContext: { capabilities: { add: ['IPC_LOCK'] } }
          ports: [{ containerPort: 8200 }]
          readinessProbe: { httpGet: { path: /v1/sys/health, port: 8200 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: openbao }
spec: { selector: { app: openbao }, ports: [{ port: 8200 }] }
---
# Receives the app's traces (OTLP/HTTP) and prints every span, so the test can check what they contain.
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, labels: { app: otel-collector } }
spec:
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.164.0
          args: ['--config=/etc/otelcol/config.yaml']
          ports: [{ containerPort: 4318 }]
          readinessProbe: { tcpSocket: { port: 4318 }, periodSeconds: 2 }
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec: { selector: { app: otel-collector }, ports: [{ port: 4318 }] }
