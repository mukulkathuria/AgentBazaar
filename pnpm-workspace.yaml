packages:
  - apps/*
  - packages/*

# Native/postinstall builds we trust. Everything else is blocked by default.
allowBuilds:
  esbuild: true
  # Temporal's workflow bundler (scale sagas); its postinstall only probes for the native binding we already ship.
  '@swc/core': false
  # OpenTelemetry's OTLP exporters and Temporal; its postinstall only checks for the optional protobufjs CLI.
  protobufjs: false

# sharp bundles LGPL libvips, which the licence policy refuses. Nothing uses it: Next.js runs with
# images.unoptimized, and webpack's minimizer (Temporal's workflow bundler) only loads it to shrink images.
overrides:
  sharp: '-'
  # StrykerJS (dev only) reaches qs through typed-rest-client, which pins qs 6.15.1 (GHSA-4mjr-xmp4-gh2g and
  # three more, fixed in 6.16.1). Same 6.x API, so share the qs the runtime already uses.
  'typed-rest-client>qs': ^6.17.1

# Supply-chain guards. pnpm also re-checks every lockfile entry against them on install.
blockExoticSubdeps: true
trustPolicy: no-downgrade
# pnpm's default floor (one day), kept explicit: a week here would fail every install while a reviewed
# update is under a week old. Renovate waits seven days before it proposes updates (renovate.json).
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@1.5.0'
